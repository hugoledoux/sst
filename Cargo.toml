[package]
name = "sst"
version = "0.3.0"
authors = ["Hugo Ledoux <h.ledoux@tudelft.nl>"]
edition = "2021"

# [dependencies.startin]
# path = "../startin/"

[dependencies]
hashbrown = "0.11.2"
rand = "0.8.0"
log = "0.4.8"
env_logger = "0.7.1"
geojson= "*"
serde_json= "*"
las = { version = "0.7", features = ["laz"] }
num-format = "0.4.0"
clap = { version = "4.0.*", features = ["derive"] }
clap-verbosity-flag = "2.0.0"
robust = "0.2"
startin = "0.6.2"
rayon = "1.6.1"

[[bin]]
name = "ttfin"
path = "src/ttfin/bin/main.rs"

[[bin]]
name = "ttdt"
path = "src/ttdt/bin/main.rs"

[[bin]]
name = "ttstats"
path = "src/ttstats/bin/main.rs"

[[bin]]
name = "ttsimpl"
path = "src/ttsimpl/bin/main.rs"

[[bin]]
name = "ttval"
path = "src/ttval/bin/main.rs"
