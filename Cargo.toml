[package]
name = "sst"
version = "0.3.0"
authors = ["Hugo Ledoux <h.ledoux@tudelft.nl>"]
edition = "2021"

# [dependencies.startin]
# path = "../startin/"

[dependencies]
hashbrown = "0.17"
rand = "0.10"
log = "0.4"
env_logger = "0.11"
geojson = "1.0"
serde_json = "1.0"
las = { version = "0.11", features = ["laz"] }
num-format = "0.4"
clap = { version = "4.6", features = ["derive"] }
clap-verbosity-flag = "3.0"
robust = "1.2"
startin = "0.8"
eframe = "0.37"


[[bin]]
name = "ttfin"
path = "src/ttfin/bin/main.rs"

[[bin]]
name = "ttdt"
path = "src/ttdt/bin/main.rs"

[[bin]]
name = "ttstats"
path = "src/ttstats/bin/main.rs"

[[bin]]
name = "ttsimpl"
path = "src/ttsimpl/bin/main.rs"

[[bin]]
name = "ttval"
path = "src/ttval/bin/main.rs"

[[bin]]
name = "ttview"
path = "src/ttview/bin/main.rs"
